<svg width="720" height="220" viewBox="0 0 720 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Public code by language</title>
  <desc id="description">JavaScript 69.4 percent, TypeScript 19.5 percent, HTML 6 percent, Rust 3.3 percent, and other languages 1.8 percent.</desc>
  <rect x="0.5" y="0.5" width="719" height="219" rx="12" fill="#0D1117" stroke="#30363D"/>

  <text x="28" y="42" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600">Public code by language</text>
  <text x="28" y="66" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Measured by code volume across public repositories</text>

  <clipPath id="bar-clip">
    <rect x="28" y="91" width="664" height="18" rx="9"/>
  </clipPath>
  <g clip-path="url(#bar-clip)">
    <rect x="28" y="91" width="461" height="18" fill="#F1E05A"/>
    <rect x="489" y="91" width="129" height="18" fill="#3178C6"/>
    <rect x="618" y="91" width="40" height="18" fill="#E34C26"/>
    <rect x="658" y="91" width="22" height="18" fill="#DEA584"/>
    <rect x="680" y="91" width="12" height="18" fill="#6E7681"/>
  </g>

  <circle cx="34" cy="142" r="5" fill="#F1E05A"/>
  <text x="47" y="147" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">JavaScript</text>
  <text x="124" y="147" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">69.4%</text>

  <circle cx="229" cy="142" r="5" fill="#3178C6"/>
  <text x="242" y="147" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">TypeScript</text>
  <text x="319" y="147" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">19.5%</text>

  <circle cx="423" cy="142" r="5" fill="#E34C26"/>
  <text x="436" y="147" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">HTML</text>
  <text x="480" y="147" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">6.0%</text>

  <circle cx="566" cy="142" r="5" fill="#DEA584"/>
  <text x="579" y="147" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Rust</text>
  <text x="611" y="147" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">3.3%</text>

  <line x1="28" y1="172.5" x2="692" y2="172.5" stroke="#21262D"/>
  <text x="28" y="198" fill="#6E7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Private and organization repositories are intentionally excluded.</text>
</svg>
